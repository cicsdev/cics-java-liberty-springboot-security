plugins
{
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'eclipse'
	id 'idea'
	id 'war'
}

group = 'com.ibm.cicsdev.springboot'
version = '0.1.0'

java
{
	toolchain
	{
		languageVersion = JavaLanguageVersion.of(java_version)
	}
}

war
{
	archiveFileName = 'cics-java-liberty-springboot-security.war'
}

bootWar { enabled = false }

eclipse
{
	classpath
	{
		downloadJavadoc = true
	}
	// Ensures Gradle Refresh sets the WTP context-root and web facet version correctly.
	wtp
	{
		facet
		{
			facet name: 'jst.web', version: '6.0'
		}
		component
		{
			contextPath = 'cics-java-liberty-springboot-security'
		}
	}
}

repositories
{
	mavenCentral()
}

dependencies
{
	// CICS TS BOM — version sourced from gradle.properties as cics.bom.version
	compileOnly enforcedPlatform("com.ibm.cics:com.ibm.cics.ts.bom:${project.property('cics.bom.version')}")

	// JCICS API (version inherited from BOM; no version needed here)
	compileOnly("com.ibm.cics:com.ibm.cics.server")

	// Spring Boot web starter dependency
	implementation("org.springframework.boot:spring-boot-starter-web")

	// Spring Boot security starter dependency
	implementation("org.springframework.boot:spring-boot-starter-security")

	// Spring Boot thymeleaf view dependency
	implementation("org.springframework.boot:spring-boot-starter-thymeleaf")

	// Don't include TomCat in the runtime build
	providedRuntime("org.springframework.boot:spring-boot-starter-tomcat")
}
